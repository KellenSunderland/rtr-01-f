areas:
  critical_only:
    description: "Critical bugs only"
    globs:
      - "**"
    rules:
      - id: "critical_only"
        description: "# Review policy: critical bugs only Comment ONLY on definite defects that would cause incorrect behaviour, data loss, crashes, resource exhaustion, or security vulnerabilities in the changed code. Each comment must name the concrete failure and how it is triggered. Do NOT comment on style, naming, formatting, documentation, tests, performance that is not a correctness problem, hypothetical or speculative issues, or anything outside the lines changed by the pull request. If you are not confident "
        severity: "high"
